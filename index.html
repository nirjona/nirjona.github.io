<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Tasnim Fariha" />
    <meta
      name="description"
      content="Software Engineer & Researcher — computer vision, deep learning and autonomous vehicles."
    />
    <meta name="theme-color" content="#14539a" />

    <!--
      Fonts are self-hosted from /fonts (see @font-face in src/custom.css).
      The previous Montserrat + Roboto + Roboto Mono request to
      fonts.googleapis.com is gone: Roboto Mono was never applied to any
      element, Roboto only sat 4th in a fallback chain behind the system
      stack, and Montserrat is fully replaced by Source Serif 4.

      Preload the two faces that are needed for first paint so they start
      downloading in parallel with the stylesheets rather than after them.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/source-serif-4-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/academicons@1.9.1/css/academicons.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/vendor-bundle.min.css" />
    <link rel="stylesheet" href="./css/wowchemy.css" />

    <link rel="icon" type="image/png" href="./media/icon-32.png" />
    <link rel="apple-touch-icon" type="image/png" href="./media/icon-180.png" />

    <title>Tasnim Fariha</title>
  </head>
  <body id="top" class="page-wrapper">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
